[project]
name = "ferret"
version = "1.0.0"
description = "Sync watched status between Plex, Jellyfin, and Emby servers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "loguru>=0.7.3",
    "packaging==25.0",
    "plexapi==4.17.1",
    "pydantic==2.11.7",
    "python-dotenv==1.1.1",
    "requests==2.32.5",
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.34.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.20",
]

[dependency-groups]
lint = [
    "ruff>=0.12.3",
]
dev = [
    "mypy>=1.16.1",
    "pytest>=8.4.1",
    "types-requests>=2.32.0.20250611",
]
