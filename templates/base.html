<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Ferret Dashboard{% endblock %}</title>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🦦 Ferret Dashboard</h1>
            <p class="subtitle">Media Server Sync Tool</p>
        </header>

        <main>
            {% block content %}{% endblock %}
        </main>

        <footer>
            <p>Ferret v1.0.0 | <a href="https://github.com/anthropics/claude-code" target="_blank">Built with Claude Code</a></p>
        </footer>
    </div>

    {% block scripts %}{% endblock %}
</body>
</html>
