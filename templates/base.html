<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Ferret Dashboard{% endblock %}</title>
    <script src="/static/htmx.min.js"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    {% if status and status.dryrun %}
    <div class="dryrun-banner">DRY RUN MODE -- No changes are being written</div>
    {% endif %}

    <header class="top-bar">
        <div class="top-bar-content">
            <a href="/" class="brand" style="text-decoration: none; color: inherit; cursor: pointer;">
                <h1>Ferret</h1>
                <span class="subtitle">Media Server Sync</span>
            </a>
            <div class="top-bar-nav">
                <a href="/" class="nav-link">Dashboard</a>
                <a href="/settings" class="nav-link">Settings</a>
            </div>
        </div>
    </header>

    <div class="container">
        <main>
            {% block content %}{% endblock %}
        </main>
    </div>

    {% block scripts %}{% endblock %}
</body>
</html>
