<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a0a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <title>{% block title %}Ferret{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/htmx.min.js"></script>
</head>
<body>
    {% if status and status.dryrun %}
    <div class="dryrun-banner">Dry Run -- No changes are being written</div>
    {% endif %}

    <header class="top-bar">
        <div class="top-bar-inner">
            <a href="/" class="brand">
                <span class="brand-logo">
                    <!-- Ferret: stylized F with sync arrows -->
                    <svg width="26" height="26" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="1" y="1" width="30" height="30" rx="3" fill="#F59E0B" fill-opacity="0.12" stroke="#F59E0B" stroke-width="1.5"/>
                        <path d="M10 8h12v2.5H13v3.5h7v2.5h-7v7.5h-3V8z" fill="#F59E0B"/>
                        <path d="M20 19l3-2.5L20 14" stroke="#14B8A6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M23 16.5h-5" stroke="#14B8A6" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                </span>
                <span class="brand-text">
                    <span class="brand-name">Ferret</span>
                    <span class="brand-sub">Media Sync</span>
                </span>
            </a>
            <nav class="top-nav">
                <a href="/" class="nav-link{% block nav_dashboard %} active{% endblock %}">Dashboard</a>
                <a href="/settings" class="nav-link{% block nav_settings %}{% endblock %}">Settings</a>
            </nav>
        </div>
    </header>

    <div class="main-container">
        {% block content %}{% endblock %}
    </div>

    <div id="toast" class="toast"></div>

    <script>
    function showToast(msg, type) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.className = 'toast ' + type + ' show';
        setTimeout(() => { t.classList.remove('show'); }, 3500);
    }

    document.body.addEventListener('htmx:afterRequest', function(e) {
        if (e.detail.pathInfo && e.detail.pathInfo.requestPath === '/api/sync/trigger') {
            try {
                const r = JSON.parse(e.detail.xhr.responseText);
                showToast(r.message, r.success ? 'success' : 'error');
            } catch(_) {}
        }
    });
    </script>

    {% block scripts %}{% endblock %}
</body>
</html>
