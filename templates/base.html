<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <title>{% block title %}Ferret{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
    tailwind.config = {
        darkMode: 'class',
        theme: {
            extend: {
                colors: {
                    black: '#000000',
                    surface: { DEFAULT: '#0a0a0a', raised: '#111111', hover: '#161616' },
                    border: { DEFAULT: '#1a1a1a', focus: '#2a2a2a' },
                    amber: { 400: '#FBBF24', 500: '#F59E0B', 600: '#D97706', 700: '#B45309', 900: '#78350F' },
                    teal: { 400: '#2DD4BF', 500: '#14B8A6', 600: '#0D9488' },
                },
                fontFamily: {
                    sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
                    mono: ['JetBrains Mono', 'SF Mono', 'Fira Code', 'Consolas', 'monospace'],
                },
            }
        }
    }
    </script>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/htmx.min.js"></script>
</head>
<body class="bg-black text-white font-sans flex flex-col antialiased min-h-screen">

    {% if status and status.dryrun %}
    <div class="bg-amber-500 text-black text-center py-1.5 px-4 font-bold text-[11px] tracking-[0.15em] uppercase sticky top-0 z-50">
        Dry Run -- No changes are being written
    </div>
    {% endif %}

    <header class="bg-surface border-b border-border sticky {% if status and status.dryrun %}top-[33px]{% else %}top-0{% endif %} z-40">
        <div class="max-w-[1400px] mx-auto w-full px-4 h-12 flex items-center justify-between">
            <a href="/" class="flex items-center gap-2.5 no-underline group">
                <span class="text-lg font-bold tracking-tight">
                    <span class="text-amber-500">F</span><span class="text-white/90 group-hover:text-white transition-colors">ERRET</span>
                </span>
                <span class="hidden sm:inline text-[10px] text-white/50 uppercase tracking-[0.12em] font-medium mt-0.5">Media Sync</span>
            </a>
            <nav class="flex gap-0.5">
                <a href="/" class="nav-link{% block nav_dashboard %} nav-active{% endblock %}">Dashboard</a>
                <a href="/settings" class="nav-link{% block nav_settings %}{% endblock %}">Settings</a>
            </nav>
        </div>
    </header>

    <main class="flex-1 flex flex-col max-w-[1400px] w-full mx-auto px-3 py-3 gap-2.5 sm:px-4 sm:py-3 min-h-0 overflow-hidden">
        {% block content %}{% endblock %}
    </main>

    <div id="toast" class="toast-notification"></div>

    <script>
    function showToast(msg, type) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.className = 'toast-notification toast-' + type + ' toast-show';
        setTimeout(() => { t.classList.remove('toast-show'); }, 3500);
    }

    document.body.addEventListener('htmx:afterRequest', function(e) {
        if (e.detail.pathInfo && e.detail.pathInfo.requestPath === '/api/sync/trigger') {
            try {
                const r = JSON.parse(e.detail.xhr.responseText);
                showToast(r.message, r.success ? 'success' : 'error');
            } catch(_) {}
        }
    });
    </script>

    {% block scripts %}{% endblock %}
</body>
</html>
