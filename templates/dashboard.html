{% extends "base.html" %}

{% block nav_dashboard %} nav-active{% endblock %}
{% block nav_settings %}{% endblock %}

{% block content %}
<!-- Status Bar -->
{% include "partials/status_header.html" %}

<!-- Log Viewer -->
<div class="flex-1 flex flex-col bg-surface border border-border rounded overflow-hidden min-h-0">
    <!-- Log Header -->
    <div class="flex items-center justify-between px-3.5 py-2 border-b border-border shrink-0 sm:px-4">
        <div class="flex items-center gap-2">
            <span class="live-dot"></span>
            <span class="text-[11px] font-semibold text-white/40 uppercase tracking-wider">Live Logs</span>
        </div>
        <div class="flex gap-1">
            <button id="btn-autoscroll" onclick="toggleAutoScroll()"
                class="px-2 py-0.5 text-[10px] font-medium rounded border border-border-focus text-amber-500 bg-transparent hover:bg-surface-raised transition-colors cursor-pointer font-sans">
                Auto-scroll
            </button>
            <button onclick="clearLogs()"
                class="px-2 py-0.5 text-[10px] font-medium rounded border border-border text-white/25 bg-transparent hover:text-white/50 hover:border-border-focus transition-colors cursor-pointer font-sans">
                Clear
            </button>
        </div>
    </div>
    <!-- Log Content -->
    <div id="logs-container" class="logs-container flex-1 overflow-y-auto bg-black font-mono text-[13px] leading-relaxed">
        <div id="logs-content" class="py-2"></div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let ws;
let autoScroll = true;
let reconnectAttempts = 0;
const MAX_RECONNECT_DELAY = 30000;

function connectWebSocket() {
    const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(`${protocol}//${window.location.host}/ws/logs`);

    ws.onopen = () => { reconnectAttempts = 0; };

    ws.onmessage = (event) => {
        const logsContent = document.getElementById('logs-content');
        const el = document.createElement('div');
        el.className = 'log-line';
        const text = event.data;

        if (text.includes('| ERROR    |')) {
            el.classList.add('log-error');
        } else if (text.includes('| WARNING  |')) {
            el.classList.add('log-warning');
        } else if (text.includes('| DEBUG    |')) {
            el.classList.add('log-debug');
        } else if (text.includes('| TRACE    |')) {
            el.classList.add('log-trace');
        } else if (text.includes('| SUCCESS  |') || (text.includes('| INFO     |') && (text.includes('completed') || text.includes('Sync complete') || text.includes('matched')))) {
            el.classList.add('log-success');
        } else {
            el.classList.add('log-info');
        }

        el.textContent = text;
        logsContent.appendChild(el);
        if (autoScroll) scrollToBottom();

        while (logsContent.children.length > 500) {
            logsContent.removeChild(logsContent.firstChild);
        }
    };

    ws.onerror = () => {};
    ws.onclose = () => {
        reconnectAttempts++;
        const delay = Math.min(1000 * Math.pow(2, reconnectAttempts), MAX_RECONNECT_DELAY);
        setTimeout(connectWebSocket, delay);
    };
}

function scrollToBottom() {
    const c = document.getElementById('logs-container');
    c.scrollTop = c.scrollHeight;
}

function toggleAutoScroll() {
    autoScroll = !autoScroll;
    const btn = document.getElementById('btn-autoscroll');
    if (autoScroll) {
        btn.classList.add('text-amber-500', 'border-amber-700');
        btn.classList.remove('text-white/25', 'border-border');
        scrollToBottom();
    } else {
        btn.classList.remove('text-amber-500', 'border-amber-700');
        btn.classList.add('text-white/25', 'border-border');
    }
}

function clearLogs() {
    const container = document.getElementById('logs-content');
    while (container.firstChild) container.removeChild(container.firstChild);
}

document.getElementById('logs-container').addEventListener('scroll', (e) => {
    const c = e.target;
    const atBottom = Math.abs(c.scrollHeight - c.scrollTop - c.clientHeight) < 5;
    autoScroll = atBottom;
    const btn = document.getElementById('btn-autoscroll');
    if (autoScroll) {
        btn.classList.add('text-amber-500', 'border-amber-700');
        btn.classList.remove('text-white/25', 'border-border');
    } else {
        btn.classList.remove('text-amber-500', 'border-amber-700');
        btn.classList.add('text-white/25', 'border-border');
    }
});

connectWebSocket();
setTimeout(scrollToBottom, 120);
</script>
{% endblock %}
