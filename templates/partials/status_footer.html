<div class="status-strip" style="border-top: 1px solid var(--border); border-radius: 0;" hx-get="/api/status/footer" hx-trigger="every 2s" hx-swap="outerHTML">
    <div class="status-strip-left">
        {% if status.is_syncing %}
        <span class="sync-badge syncing"><span class="sync-dot"></span> Syncing</span>
        {% if status.current_operation %}
        <span class="op-label">{{ status.current_operation }}</span>
        {% endif %}
        {% else %}
        <span class="sync-badge idle">Idle</span>
        {% if status.last_sync_time %}
        <span class="op-label">Last sync: {{ status.last_sync_time }}</span>
        {% endif %}
        {% endif %}
    </div>
</div>
